[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adoptme"
version = "0.1.0"
description = "AdoptMe - plataforma web para divulgacao de animais para adocao (Flask API + Vue 3)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Migrate>=4.0",
    "Flask-CORS>=4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["ipython", "flask-shell-ipython", "Flask-DebugToolbar"]
test = ["pytest>=8.3", "pytest-cov>=5.0", "pytest-flask"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "frontend*"]
